# 用 GitHub Actions 在 Windows x64 (MSVC) 上编译最新的 64 位 DLL：
#   zlib  v1.3.2 -> z.dll      (build-zlib/Release/)
#   zstd  v1.5.7 -> zstd.dll   (build-zstd/lib/Release/)
#
# 用法：
#   1. 建一个空仓库，把本文件放到 .github/workflows/build-dlls.yml 并 push
#   2. 仓库 Actions 页签 -> 左侧选中本 workflow -> Run workflow（手动触发）
#   3. 跑完后在 run 页面底部 Artifacts 里下载 dlls-x64-... 压缩包
#
# 说明：
#   - 上游源码在 job 内 clone，仓库本身不需要任何源码
#   - 不重命名 DLL：产物保持编译出的原名与路径
#   - Boost.Random 用 runner 自带的 vcpkg 构建（x64-windows 动态库），
#     命名保持 vcpkg 标准格式 boost_random-vc143-mt-x64-1_XX.dll
#   - 显式打开共享库开关（ZLIB_BUILD_SHARED / ZSTD_BUILD_SHARED），避免上游改默认值
#   - 导入库与 DLL 名天然一致（z.lib / zstd.lib），无需重新生成
#   - 内置校验：PE 架构必须为 x64，并用 ctypes 实际加载两个 DLL 做冒烟测试和版本断言

name: Build zlib + zstd DLLs (Windows x64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (repo 只作为 workflow 载体)
        uses: actions/checkout@v4

      - name: Clone zlib v1.3.2
        run: git clone --depth 1 --branch v1.3.2 https://github.com/madler/zlib.git zlib

      - name: Clone zstd v1.5.7
        run: git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git zstd

      - name: Build zlib (MSVC x64 Release)
        run: |
          cmake -S zlib -B build-zlib -A x64 -DZLIB_BUILD_SHARED=ON -DZLIB_BUILD_TESTING=OFF
          cmake --build build-zlib --config Release --parallel

      - name: Build zstd (MSVC x64 Release)
        run: |
          cmake -S zstd/build/cmake -B build-zstd -A x64 -DZSTD_BUILD_SHARED=ON -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF -DZSTD_BUILD_CONTRIB=OFF
          cmake --build build-zstd --config Release --parallel

      - name: Verify PE arch (x64) + load smoke test + version asserts
        shell: bash
        run: |
          python - <<'PY'
          import ctypes, struct, os
          def pe_arch(p):
              with open(p,'rb') as f:
                  f.seek(0x3c); pe = struct.unpack('<I', f.read(4))[0]
                  f.seek(pe+4); m = struct.unpack('<H', f.read(2))[0]
              return {0x8664:'x64', 0x14c:'x86', 0xaa64:'ARM64'}.get(m, '0x%04X' % m)
          for p in ('build-zlib/Release/z.dll','build-zstd/lib/Release/zstd.dll'):
              a = pe_arch(p)
              print(p, '->', a)
              assert a == 'x64', p + ' is not x64'
          # Python 3.8+ 在 Windows 上不按 PATH 搜索 DLL，必须用绝对路径加载
          z = ctypes.CDLL(os.path.abspath('build-zlib/Release/z.dll'))
          z.zlibVersion.restype = ctypes.c_char_p
          s = ctypes.CDLL(os.path.abspath('build-zstd/lib/Release/zstd.dll'))
          s.ZSTD_versionString.restype = ctypes.c_char_p
          zv = z.zlibVersion().decode(); sv = s.ZSTD_versionString().decode()
          print('z.dll     version =', zv)
          print('zstd.dll  version =', sv)
          assert zv == '1.3.2' and sv == '1.5.7'
          PY

      - name: Collect headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/include/zlib, out/include/zstd | Out-Null
          Copy-Item zlib/zlib.h, build-zlib/zconf.h out/include/zlib/
          Copy-Item zstd/lib/zstd.h, zstd/lib/zdict.h, zstd/lib/zstd_errors.h out/include/zstd/

      - name: Build Boost.Random (vcpkg, x64-windows, latest registry)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # runner 自带 C:\vcpkg；缺失则现装
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            & 'C:\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
          }
          $env:Path = 'C:\vcpkg;' + $env:Path
          # 更新 registry 到最新（争取拿到 Boost 1.92），失败则用自带版本
          git -C C:\vcpkg pull --ff-only origin master
          if ($LASTEXITCODE -ne 0) { Write-Warning 'vcpkg registry update failed, will use bundled version' }
          vcpkg install boost-random:x64-windows --clean-after-build
          Write-Host '---- installed boost DLLs ----'
          Get-ChildItem 'C:\vcpkg\installed\x64-windows\bin\boost*.dll' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Collect Boost DLLs and libs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/boost | Out-Null
          Copy-Item 'C:\vcpkg\installed\x64-windows\bin\boost*.dll' out/boost/ -ErrorAction SilentlyContinue
          Copy-Item 'C:\vcpkg\installed\x64-windows\lib\boost*.lib' out/boost/ -ErrorAction SilentlyContinue
          Get-ChildItem out/boost | ForEach-Object Name

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dlls-x64-zlib1.3.2-zstd1.5.7
          path: |
            build-zlib/Release/z.dll
            build-zlib/Release/z.lib
            build-zlib/Release/zs.lib
            build-zstd/lib/Release/zstd.dll
            build-zstd/lib/Release/zstd.lib
            build-zstd/lib/Release/zstd_static.lib
            out/include/**
            out/boost/**
