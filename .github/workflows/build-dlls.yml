# =====================================================================
# 用 GitHub Actions 在 Windows x64 (MSVC) 上编译最新 64 位 DLL，产物打包上传。
#
# 最终压缩包（dlls-x64）只包含以下 8 个 DLL（+ 配套 .lib / 头文件）：
#   zlib1.dll      ← zlib 最新 tag，源码构建（CMake 输出 z.dll，collect 时改名为官方分发名 zlib1.dll）
#   zstd.dll       ← zstd 最新 tag，源码构建
#   boost_random-*.dll  ← vcpkg 最新 boost-random
#   embree4.dll    ← vcpkg 最新 embree（依赖 tbb12.dll，包内已配齐）
#   tbb12.dll      ← vcpkg 最新 oneTBB
#   freetype.dll   ← freetype 最新 tag，源码构建·静态依赖版（zlib/libpng/bzip2/brotli 内嵌，单文件可用）
#   vmm.dll        ← MemProcFS master
#   leechcore.dll  ← LeechCore master（vmm 链接依赖，包内已配齐）
#
# 用法：
#   1. 建一个空仓库，把本文件放到 .github/workflows/build-dlls.yml 并 push
#   2. 仓库 Actions 页签 -> 左侧选中本 workflow -> Run workflow（手动触发）
#   3. 跑完后在 run 页面底部 Artifacts 里下载 dlls-x64 压缩包
#
# 设计要点：
#   - 仓库本身不需要任何源码，上游全部在 job 内 clone
#   - zlib/zstd/freetype 每次运行先用 git ls-remote 自动取最新 tag（不走 api.github.com，
#     避免匿名限流 403）；想锁版本可改回 clone 时写死 tag
#   - vcpkg 只编 Release：自定义三元组 x64-windows-release（VCPKG_BUILD_TYPE=release），
#     各包自带 :x64-windows-release 后缀（后缀只挂一个包会导致其它包编 debug+release 双份）
#   - FreeType 静态依赖用独立三元组 x64-windows-static-md-release（静态库 + /MD CRT），
#     构建用；4 个依赖包只作为构建依赖，不进产物
#   - vcpkg installed + downloads 走 Actions 缓存，key=registry git 版本号：
#     registry 没更新 -> 命中秒过；更新 -> 回退旧缓存，只重编有变化的包
#   - vmm.dll 链接需要 leechcore.lib：先克隆同级 ufrisk/LeechCore 编译，
#     再直接编 memprocfs\vmm\vmm.vcxproj（强制 SolutionDir 指向 memprocfs\），
#     避开 MemProcFS.sln 里同名文件夹的 /t: 歧义和 vmmpyc 的 Python 工具依赖
#   - 内置校验：zlib/zstd 做 ctypes 加载 + 版本断言；collect 后对全部 DLL 做 PE=x64 检查
# =====================================================================

name: 'Build Windows x64 DLLs (8: zlib1 zstd boost_random embree4 tbb12 freetype vmm leechcore)'

on:
  workflow_dispatch:   # 仅手动触发，不自动跑

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (repo 只作为 workflow 载体)
        uses: actions/checkout@v7.0.1

      # ========== 1) 取最新 tag + 克隆源码（zlib / zstd / freetype） ==========

      - name: Resolve latest tags + clone sources (zlib/zstd/freetype)
        id: latest
        shell: bash
        run: |
          # git 自带版本排序取最新 tag；只认纯数字版本 tag（zstd 旧 tag 是 zstd-0.x、
          # 还有 v1.5.7-kernel 这类变体，都会干扰排序），再去掉 peel 的 ^{} 行
          ZLIB_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/madler/zlib.git | grep -E 'refs/tags/v[0-9][0-9.]*$' | grep -v '\^{}' | head -1 | awk '{print $2}' | sed 's#refs/tags/##')
          ZSTD_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/facebook/zstd.git | grep -E 'refs/tags/v[0-9][0-9.]*$' | grep -v '\^{}' | head -1 | awk '{print $2}' | sed 's#refs/tags/##')
          # FreeType 的 tag 是 VER-2-14-3 格式（大写 VER + 短横线）；旧 tag 有 VER-2-BETA2 等干扰项，
          # 用 VER-2-[0-9][0-9-]* 过滤只留正式发布版
          FT_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/freetype/freetype.git | grep -E 'refs/tags/VER-2-[0-9][0-9-]*$' | grep -v '\^{}' | head -1 | awk '{print $2}' | sed 's#refs/tags/##')
          if [ -z "$ZLIB_TAG" ] || [ -z "$ZSTD_TAG" ] || [ -z "$FT_TAG" ]; then echo "::error::failed to resolve latest tags"; exit 1; fi
          echo "zlib=$ZLIB_TAG" >> "$GITHUB_OUTPUT"
          echo "zstd=$ZSTD_TAG" >> "$GITHUB_OUTPUT"
          echo "freetype=$FT_TAG" >> "$GITHUB_OUTPUT"
          echo "resolved zlib=$ZLIB_TAG zstd=$ZSTD_TAG freetype=$FT_TAG"
          git clone --depth 1 --branch "$ZLIB_TAG" https://github.com/madler/zlib.git zlib
          git clone --depth 1 --branch "$ZSTD_TAG" https://github.com/facebook/zstd.git zstd
          git clone --depth 1 --branch "$FT_TAG" https://github.com/freetype/freetype.git freetype

      # ========== 2) zlib + zstd：CMake 源码构建 ==========

      - name: Build zlib + zstd (MSVC x64 Release)
        run: |
          cmake -S zlib -B build-zlib -A x64 -DZLIB_BUILD_SHARED=ON -DZLIB_BUILD_TESTING=OFF
          cmake --build build-zlib --config Release --parallel
          cmake -S zstd/build/cmake -B build-zstd -A x64 -DZSTD_BUILD_SHARED=ON -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF -DZSTD_BUILD_CONTRIB=OFF
          cmake --build build-zstd --config Release --parallel

      - name: Verify zlib/zstd (PE=x64 + ctypes 加载 + 版本断言)
        shell: bash
        env:
          ZLIB_TAG: ${{ steps.latest.outputs.zlib }}
          ZSTD_TAG: ${{ steps.latest.outputs.zstd }}
        run: |
          python - <<'PY'
          import ctypes, struct, os
          def pe_arch(p):
              with open(p,'rb') as f:
                  f.seek(0x3c); pe = struct.unpack('<I', f.read(4))[0]
                  f.seek(pe+4); m = struct.unpack('<H', f.read(2))[0]
              return {0x8664:'x64', 0x14c:'x86', 0xaa64:'ARM64'}.get(m, '0x%04X' % m)
          for p in ('build-zlib/Release/z.dll','build-zstd/lib/Release/zstd.dll'):
              a = pe_arch(p)
              print(p, '->', a)
              assert a == 'x64', p + ' is not x64'
          # Python 3.8+ 在 Windows 上不按 PATH 搜索 DLL，必须用绝对路径加载
          z = ctypes.CDLL(os.path.abspath('build-zlib/Release/z.dll'))
          z.zlibVersion.restype = ctypes.c_char_p
          s = ctypes.CDLL(os.path.abspath('build-zstd/lib/Release/zstd.dll'))
          s.ZSTD_versionString.restype = ctypes.c_char_p
          zv = z.zlibVersion().decode(); sv = s.ZSTD_versionString().decode()
          print('z.dll     version =', zv)
          print('zstd.dll  version =', sv)
          assert zv == os.environ['ZLIB_TAG'].lstrip('v') and sv == os.environ['ZSTD_TAG'].lstrip('v')
          PY

      # ========== 3) vcpkg：构建依赖（boost/embree/tbb 动态 + freetype 静态依赖） ==========

      - name: Prepare vcpkg (clone if missing, pull registry, record rev)
        id: prepare-vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # runner 自带 C:\vcpkg；缺失则现装
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            & 'C:\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
          }
          $env:Path = 'C:\vcpkg;' + $env:Path
          # 更新 registry 到最新（争取拿到 Boost 1.92），失败则用自带版本
          git -C C:\vcpkg pull --ff-only origin master
          if ($LASTEXITCODE -ne 0) { Write-Warning 'vcpkg registry update failed, will use bundled version' }
          # 缓存 key 用 registry 的 git 版本号：registry 没变则缓存命中，变了则自然失效
          $head = git -C C:\vcpkg rev-parse HEAD
          "rev=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Restore vcpkg cache (installed + downloads)
        uses: actions/cache@v6.1.0
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
          key: vcpkg-${{ steps.prepare-vcpkg.outputs.rev }}
          restore-keys: |
            vcpkg-

      - name: Build vcpkg deps (boost/embree/tbb 动态 + freetype 静态依赖, x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = 'C:\vcpkg;' + $env:Path
          # 只编 Release：写 release-only triplet，跳过 debug 构建（时间约省一半）
          New-Item -ItemType Directory -Force 'C:\vcpkg\triplets\community' | Out-Null
          Set-Content -Path 'C:\vcpkg\triplets\community\x64-windows-release.cmake' -Value @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)
          '@ -Encoding ascii
          # FreeType 静态依赖用的 triplet：静态库 + /MD 动态 CRT（与 freetype.dll 本体保持一致）
          Set-Content -Path 'C:\vcpkg\triplets\community\x64-windows-static-md-release.cmake' -Value @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_BUILD_TYPE release)
          '@ -Encoding ascii
          # 注意：triplet 后缀必须每个包各自带，只挂最后一个会导致其它包编 debug+release 双份
          vcpkg install boost-random:x64-windows-release embree:x64-windows-release tbb:x64-windows-release `
            zlib:x64-windows-static-md-release libpng:x64-windows-static-md-release bzip2:x64-windows-static-md-release brotli:x64-windows-static-md-release --clean-after-build
          Write-Host '---- installed vcpkg DLLs (boost/embree/tbb) ----'
          Get-ChildItem 'C:\vcpkg\installed\x64-windows-release\bin\*.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(boost|embree|tbb)' } | ForEach-Object { Write-Host $_.FullName }
          Write-Host '---- installed static libs (freetype 静态依赖) ----'
          Get-ChildItem 'C:\vcpkg\installed\x64-windows-static-md-release\lib\*.lib' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(zlib|zs|libpng|bz2|brotli)' } | ForEach-Object { Write-Host $_.Name }

      # ========== 4) FreeType：源码构建，静态依赖版 ==========

      - name: Build FreeType (static deps 静态依赖版, MSVC x64 Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sp = 'C:\vcpkg\installed\x64-windows-static-md-release'
          # 应用 vcpkg 官方 freetype 端口补丁（与 vcpkg 构建配方一致）：
          #   brotli-static.patch = 让 freetype 的 FindBrotliDec 同时链接 brotlicommon 静态库（必须）
          #   bzip2.patch         = 仅修正 pkgconfig 文件（保险起见一并应用）
          curl.exe -sL -o "$env:RUNNER_TEMP\brotli-static.patch" https://raw.githubusercontent.com/microsoft/vcpkg/master/ports/freetype/brotli-static.patch
          curl.exe -sL -o "$env:RUNNER_TEMP\bzip2.patch" https://raw.githubusercontent.com/microsoft/vcpkg/master/ports/freetype/bzip2.patch
          git -C freetype apply "$env:RUNNER_TEMP\brotli-static.patch"
          git -C freetype apply "$env:RUNNER_TEMP\bzip2.patch"
          # 静态依赖版：zlib/libpng/bzip2/brotli 全部以静态库链进 freetype.dll -> 单文件可用
          # 注意：vcpkg zlib 静态库名是 zs.lib（zlib 1.3.2 CMake OUTPUT_NAME z+suffix，非 zlib.lib）
          # PNG/ZLIB 模块 FindPNG/FindZLIB 会直接采用显式 cache 变量；BrotliDec 走项目内 FindBrotliDec.cmake（已打补丁）
          cmake -S freetype -B build-freetype -A x64 `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_PREFIX_PATH="$sp" `
            -DFT_REQUIRE_ZLIB=ON -DFT_REQUIRE_PNG=ON -DFT_REQUIRE_BZIP2=ON -DFT_REQUIRE_BROTLI=ON `
            -DFT_DISABLE_HARFBUZZ=ON `
            -DZLIB_INCLUDE_DIR="$sp\include" -DZLIB_LIBRARY="$sp\lib\zs.lib" `
            -DPNG_PNG_INCLUDE_DIR="$sp\include" -DPNG_LIBRARY="$sp\lib\libpng16.lib" `
            -DBZIP2_INCLUDE_DIR="$sp\include" -DBZIP2_LIBRARY="$sp\lib\bz2.lib" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          if ($LASTEXITCODE -ne 0) { throw 'freetype cmake configure failed' }
          cmake --build build-freetype --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'freetype build failed' }
          Get-ChildItem build-freetype/Release/freetype.dll, build-freetype/Release/freetype.lib |
            ForEach-Object { Write-Host $_.FullName }

      # ========== 5) MemProcFS：leechcore.dll + vmm.dll ==========

      - name: Build LeechCore + vmm (MemProcFS, MSVC x64 Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 仓库名是 ufrisk（不是 ulfrisk）；vmm 链接需要 leechcore.lib，须先克隆同级 LeechCore
          git clone --depth 1 https://github.com/ufrisk/MemProcFS.git memprocfs
          git clone --depth 1 https://github.com/ufrisk/LeechCore.git LeechCore
          # leechcore 的 PostBuild 会 copy 到 W:\bin，用 subst 造一个虚拟 W: 盘避免失败
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\w\bin" | Out-Null
          subst W: "$env:RUNNER_TEMP\w"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -property installationPath).Trim()
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          # 强制 SolutionDir=memprocfs\：leechcore 构建后把 leechcore.lib 拷进 memprocfs\includes\lib64，
          # vmm 再从同一路径链接；直接指定 .vcxproj 构建，避开 sln 里同名文件夹的歧义
          $slndir = Join-Path $env:GITHUB_WORKSPACE 'memprocfs\'
          & $msbuild LeechCore\leechcore\leechcore.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$slndir" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'leechcore build failed' }
          & $msbuild memprocfs\vmm\vmm.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$slndir" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'vmm build failed' }
          subst W: /d
          Write-Host '---- vmm.dll / leechcore.dll ----'
          Get-ChildItem memprocfs -Recurse -Filter vmm.dll -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem memprocfs -Recurse -Filter leechcore.dll -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      # ========== 6) 收集 8 个 DLL + PE 校验 ==========

      - name: Collect 8 DLLs into out/ + PE=x64 校验
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null

          # --- zlib：z.dll -> zlib1.dll（官方分发名），带 import lib z.lib ---
          Copy-Item build-zlib/Release/z.dll 'out/zlib1.dll'
          Copy-Item build-zlib/Release/z.lib 'out/z.lib' -ErrorAction SilentlyContinue
          # zlib/zstd 头文件
          New-Item -ItemType Directory -Force out/include/zlib, out/include/zstd | Out-Null
          Copy-Item zlib/zlib.h, build-zlib/zconf.h out/include/zlib/
          Copy-Item zstd/lib/zstd.h, zstd/lib/zdict.h, zstd/lib/zstd_errors.h out/include/zstd/

          # --- zstd：原名 zstd.dll + import lib ---
          Copy-Item build-zstd/lib/Release/zstd.dll 'out/zstd.dll'
          Copy-Item build-zstd/lib/Release/zstd.lib 'out/zstd.lib' -ErrorAction SilentlyContinue

          # --- vcpkg 动态产物：只收清单内的 3 个（不匹配 tbbmalloc* 等） ---
          $bin = 'C:\vcpkg\installed\x64-windows-release\bin'
          $lib = 'C:\vcpkg\installed\x64-windows-release\lib'
          $boost = Get-ChildItem $bin -Filter 'boost_random*.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $boost) { throw 'boost_random.dll not found' }
          Copy-Item $boost.FullName out/
          Copy-Item "$lib\boost_random*.lib" out/ -ErrorAction SilentlyContinue
          foreach ($n in 'embree4.dll', 'tbb12.dll') {
            if (-not (Test-Path "$bin\$n")) { throw "$n not found" }
            Copy-Item "$bin\$n" "out/$n"
          }
          Copy-Item "$lib\embree4.lib", "$lib\tbb12.lib" out/ -ErrorAction SilentlyContinue

          # --- freetype：静态依赖版单文件 ---
          if (-not (Test-Path 'build-freetype/Release/freetype.dll')) { throw 'freetype.dll not found' }
          Copy-Item build-freetype/Release/freetype.dll 'out/freetype.dll'
          Copy-Item build-freetype/Release/freetype.lib 'out/freetype.lib'

          # --- MemProcFS：vmm.dll + leechcore.dll（leechcore.lib 在 files\x64\lib\） ---
          $vmm = Get-ChildItem memprocfs -Recurse -Filter vmm.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vmm) { throw 'vmm.dll not found' }
          Copy-Item $vmm.FullName 'out/vmm.dll'
          $vmmlib = Get-ChildItem memprocfs -Recurse -Filter vmm.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vmmlib) { Copy-Item $vmmlib.FullName 'out/vmm.lib' }
          $lc = Get-ChildItem memprocfs -Recurse -Filter leechcore.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lc) { throw 'leechcore.dll not found' }
          Copy-Item $lc.FullName 'out/leechcore.dll'
          $lclib = Get-ChildItem memprocfs -Recurse -Filter leechcore.lib -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'files\\x64\\lib' } | Select-Object -First 1
          if ($lclib) { Copy-Item $lclib.FullName 'out/leechcore.lib' }

          # --- 全部 DLL 做 PE=x64 校验 ---
          function Get-PEArch([string]$p) {
            $fs = [System.IO.File]::OpenRead($p)
            try {
              $br = [System.IO.BinaryReader]::new($fs)
              $fs.Seek(0x3C, [System.IO.SeekOrigin]::Begin) | Out-Null
              $pe = $br.ReadInt32()
              $fs.Seek($pe + 4, [System.IO.SeekOrigin]::Begin) | Out-Null
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $bad = @()
          Get-ChildItem out -Filter '*.dll' | ForEach-Object {
            $m = Get-PEArch $_.FullName
            $arch = if ($m -eq 0x8664) { 'x64' } elseif ($m -eq 0x14c) { 'x86' } else { ('0x{0:X}' -f $m) }
            Write-Host ("{0,-45} {1}" -f $_.Name, $arch)
            if ($m -ne 0x8664) { $bad += $_.Name }
          }
          if ($bad.Count -gt 0) { throw "非 x64 DLL: $($bad -join ', ')" }
          Write-Host ''
          Write-Host '---- out/ 最终内容 ----'
          Get-ChildItem out -Recurse -File | ForEach-Object { $_.FullName.Replace("$PWD\out\", '') } | Sort-Object

      # ========== 7) 上传 ==========

      - name: Upload artifacts (dlls-x64)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dlls-x64
          path: out/**
